name: Frosty Weather release

# Runs only when started by hand: Actions tab → "Frosty Weather release" → Run workflow,
# or `gh workflow run release.yml`. The version comes from frostyVersionName in app/build.gradle.kts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: expected version, without the leading "v". The run stops if it differs from app/build.gradle.kts.'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as a draft (publish it yourself from the Releases page)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the build reads the commit count

      - name: Read versions, check inputs and signing secrets
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          VERSION=$(sed -n 's/^val frostyVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          BREEZY_VERSION=$(sed -n 's/^val breezyVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ] || [ -z "$BREEZY_VERSION" ]; then
            echo "::error::Could not read frostyVersionName / breezyVersion from app/build.gradle.kts"; exit 1
          fi
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$VERSION" ]; then
            echo "::error::Asked for $EXPECTED_VERSION but app/build.gradle.kts says $VERSION"; exit 1
          fi
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BREEZY_VERSION=$BREEZY_VERSION" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          for s in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret $s"; exit 1; fi
          done

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # No -Pbreezy: modified builds must not carry the Breezy Weather branding (see LICENSE_ADDITIONAL)
      - name: Assemble release APKs
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          GRADLE_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then
            GRADLE_ARGS="-PfrostyPrerelease"
          fi
          ./gradlew assembleBasicRelease assembleFreenetRelease $GRADLE_ARGS

      - name: Sign APKs (basic)
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/basic/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Sign APKs (freenet)
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/freenet/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Rename APKs, compute checksums, archive mapping files
        run: |
          set -e
          mkdir dist
          for variant in universal arm64-v8a armeabi-v7a x86 x86_64; do
            mv "app/build/outputs/apk/basic/release/app-basic-$variant-release-unsigned-signed.apk" \
               "dist/frosty-weather-$TAG"_"$variant.apk"
          done
          mv app/build/outputs/apk/freenet/release/app-freenet-universal-release-unsigned-signed.apk \
             "dist/frosty-weather-$TAG"_freenet.apk
          tar -czf "dist/mapping-$TAG"_standard.tar.gz --directory=app/build/outputs/mapping/basicRelease mapping.txt
          tar -czf "dist/mapping-$TAG"_freenet.tar.gz --directory=app/build/outputs/mapping/freenetRelease mapping.txt

          {
            echo "**Not sure which file to pick? Download \`frosty-weather-${TAG}_universal.apk\`.** See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for details."
            echo
            echo "Based on [Breezy Weather $BREEZY_VERSION](https://github.com/breezy-weather/breezy-weather/releases/tag/v$BREEZY_VERSION)."
            echo
            echo "---"
            echo
            echo "### Checksums"
            echo "| File | SHA-256 |"
            echo "|------|---------|"
            cd dist
            for f in *.apk; do echo "| \`$f\` | \`$(sha256sum "$f" | awk '{ print $1 }')\` |"; done
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Frosty Weather ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
